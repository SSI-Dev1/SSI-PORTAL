name: Security checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - name: Type check
        run: npm run typecheck
      - name: No secrets or demo credentials in source
        run: |
          # Key-shaped values only (role *names* such as service_role are fine).
          if git grep -nIE "SERVICE_ROLE_KEY[\"' ]*[:=][\"' ]*[A-Za-z0-9._-]{20,}|sb_secret_[A-Za-z0-9]{10,}|sk_live_[A-Za-z0-9]{10,}|BEGIN [A-Z ]*PRIVATE KEY|eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[A-Za-z0-9_-]{20,}" -- ':!*.md' ':!.github/**'; then
            echo "::error::Possible secret committed"; exit 1
          fi

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: RLS / authorisation tests on PostgreSQL
        run: |
          export PATH="/usr/lib/postgresql/$(ls /usr/lib/postgresql | sort -n | tail -1)/bin:$PATH"
          bash supabase/tests/run.sh
