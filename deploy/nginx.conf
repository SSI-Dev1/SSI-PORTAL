# Hardened nginx site for the SSI GLOBAL CRM (static build) on your own VPS.
#
#  1. Build:      npm ci && npm run build   (with production .env)
#  2. Copy:       rsync -a --delete dist/ deploy@server:/var/www/ssi-crm/
#  3. TLS:        certbot --nginx -d crm.example.com
#  4. Replace crm.example.com and <project-ref> below, then: nginx -t && systemctl reload nginx
#
# The app is a static bundle; all data access goes to Supabase over HTTPS and is
# authorised there (RLS). This server never holds database credentials.

# Request rate limiting (per client IP).
limit_req_zone $binary_remote_addr zone=ssi_static:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=ssi_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name crm.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crm.example.com;

    ssl_certificate     /etc/letsencrypt/live/crm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    root /var/www/ssi-crm;
    index index.html;
    server_tokens off;
    client_max_body_size 1k;          # the static site accepts no uploads (files go to Supabase Storage)
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_req zone=ssi_static burst=60 nodelay;
    limit_conn ssi_conn 30;

    # ---- security headers (sent on every response)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-REPLACE_WITH_HASH_FROM_dist/index.html'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://<project-ref>.supabase.co wss://<project-ref>.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # Only GET/HEAD are meaningful for a static site.
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # Never serve dotfiles (.env, .git …) or source maps.
    location ~ /\.  { deny all; return 404; }
    location ~ \.map$ { deny all; return 404; }

    # Hash routing: every route is index.html. Don't cache it, so new deploys apply at once.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-REPLACE_WITH_HASH_FROM_dist/index.html'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://<project-ref>.supabase.co wss://<project-ref>.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    }
}
