# Example nginx site for a VPS / dedicated server.
# Build with `npm run build`, then copy dist/ to /var/www/ssi-crm.
server {
    listen 80;
    server_name crm.example.com;           # your domain (add TLS with certbot)

    root /var/www/ssi-crm;
    index index.html;

    # The app uses hash routing, so every route is served by index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
