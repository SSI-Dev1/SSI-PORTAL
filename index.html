<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="SSI GLOBAL partner and admissions CRM — private sign-in for SSI GLOBAL staff and authorised consultancy partners." />
    <meta name="application-name" content="SSI GLOBAL CRM" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      // Apply the saved theme before first paint (see src/theme/theme.tsx).
      (function () {
        try {
          var p = localStorage.getItem('ssi-theme') || 'system';
          var dark = p === 'dark' || (p === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <title>SSI GLOBAL CRM</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
